<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>V7 AI Document Scanner</title>

<!-- OpenCV -->
<script async
src="https://docs.opencv.org/4.x/opencv.js"
onload="opencvReady()"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:black;
  overflow:hidden;
}

#app{
  position:fixed;
  inset:0;
  background:black;
}

video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:20;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.8),
    transparent
  );
}

.icon-btn{
  width:50px;
  height:50px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  color:white;
  font-size:22px;
  backdrop-filter:blur(10px);
}

.title{
  color:white;
  font-size:18px;
  font-weight:bold;
}

.status{
  position:absolute;
  top:100px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 22px;
  border-radius:999px;
  background:rgba(0,0,0,.55);
  color:white;
  z-index:20;
  backdrop-filter:blur(10px);
}

.bottom{
  position:absolute;
  bottom:40px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  z-index:20;
}

.capture-btn{
  width:95px;
  height:95px;
  border-radius:50%;
  border:6px solid white;
  background:white;
}

.ready-dot{
  position:absolute;
  top:110px;
  right:20px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 20px #22c55e;
  z-index:20;
}

#hiddenCanvas{
  display:none;
}

.loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  background:black;
  z-index:999;
  font-size:20px;
}

</style>
</head>
<body>

<div id="app">

  <div class="loading" id="loading">
    Loading OpenCV...
  </div>

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <canvas id="overlay"></canvas>

  <canvas id="hiddenCanvas"></canvas>

  <div class="topbar">

    <button class="icon-btn"
      onclick="closeScanner()">
      ✕
    </button>

    <div class="title">
      V7 AI Scanner
    </div>

    <button class="icon-btn"
      onclick="toggleTorch()">
      💡
    </button>

  </div>

  <div class="status"
    id="status">
    Mencari dokumen...
  </div>

  <div class="ready-dot"></div>

  <div class="bottom">

    <button class="capture-btn"
      onclick="captureImage()">
    </button>

  </div>

</div>

<script>

let stream = null;
let scanning = false;
let cvReady = false;
let torch = false;

const video =
document.getElementById("video");

const overlay =
document.getElementById("overlay");

const hiddenCanvas =
document.getElementById("hiddenCanvas");

const statusText =
document.getElementById("status");

const ctx =
overlay.getContext("2d");

const hiddenCtx =
hiddenCanvas.getContext("2d");

/* ====================================
OPENCV READY
==================================== */

function opencvReady(){

  cv["onRuntimeInitialized"] = ()=>{

    cvReady = true;

    document.getElementById(
      "loading"
    ).style.display = "none";

    startCamera();
  };
}

/* ====================================
START CAMERA
==================================== */

async function startCamera(){

  try{

    stream =
    await navigator.mediaDevices
    .getUserMedia({

      video:{
        facingMode:"environment",
        width:{ideal:1920},
        height:{ideal:1080}
      },

      audio:false
    });

    video.srcObject = stream;

    video.onloadedmetadata = ()=>{

      overlay.width =
      video.videoWidth;

      overlay.height =
      video.videoHeight;

      hiddenCanvas.width = 320;
      hiddenCanvas.height = 240;

      scanning = true;

      requestAnimationFrame(
        processFrame
      );
    };

  }catch(err){

    alert(
      "Tidak bisa mengakses kamera"
    );

    console.log(err);
  }
}

/* ====================================
PROCESS FRAME
==================================== */

function processFrame(){

  if(!scanning) return;

  detectDocument();

  requestAnimationFrame(
    processFrame
  );
}

/* ====================================
DOCUMENT DETECTION
==================================== */

function detectDocument(){

  const w = hiddenCanvas.width;
  const h = hiddenCanvas.height;

  hiddenCtx.drawImage(
    video,
    0,
    0,
    w,
    h
  );

  let src =
  cv.imread(hiddenCanvas);

  let gray =
  new cv.Mat();

  let blur =
  new cv.Mat();

  let edges =
  new cv.Mat();

  let contours =
  new cv.MatVector();

  let hierarchy =
  new cv.Mat();

  /* grayscale */

  cv.cvtColor(
    src,
    gray,
    cv.COLOR_RGBA2GRAY
  );

  /* blur */

  cv.GaussianBlur(
    gray,
    blur,
    new cv.Size(5,5),
    0
  );

  /* edges */

  cv.Canny(
    blur,
    edges,
    75,
    200
  );

  /* contours */

  cv.findContours(
    edges,
    contours,
    hierarchy,
    cv.RETR_LIST,
    cv.CHAIN_APPROX_SIMPLE
  );

  let biggest = null;
  let maxArea = 0;

  for(let i=0;
      i<contours.size();
      i++){

    let cnt =
    contours.get(i);

    let peri =
    cv.arcLength(cnt,true);

    let approx =
    new cv.Mat();

    cv.approxPolyDP(
      cnt,
      approx,
      0.02 * peri,
      true
    );

    let area =
    cv.contourArea(cnt);

    if(
      approx.rows === 4 &&
      area > maxArea &&
      area > 5000
    ){

      biggest = approx;
      maxArea = area;
    }
  }

  ctx.clearRect(
    0,
    0,
    overlay.width,
    overlay.height
  );

  if(biggest){

    drawDocumentPolygon(biggest);

    statusText.innerHTML =
    "Dokumen terdeteksi";

  }else{

    statusText.innerHTML =
    "Mencari dokumen...";
  }

  src.delete();
  gray.delete();
  blur.delete();
  edges.delete();
  contours.delete();
  hierarchy.delete();
}

/* ====================================
DRAW POLYGON
==================================== */

function drawDocumentPolygon(approx){

  const scaleX =
  overlay.width /
  hiddenCanvas.width;

  const scaleY =
  overlay.height /
  hiddenCanvas.height;

  let points = [];

  for(let i=0;
      i<4;
      i++){

    let x =
    approx.intPtr(i,0)[0];

    let y =
    approx.intPtr(i,0)[1];

    points.push({
      x:x * scaleX,
      y:y * scaleY
    });
  }

  /* dark overlay */

  ctx.fillStyle =
  "rgba(0,0,0,.45)";

  ctx.beginPath();

  ctx.rect(
    0,
    0,
    overlay.width,
    overlay.height
  );

  ctx.moveTo(
    points[0].x,
    points[0].y
  );

  for(let i=1;
      i<points.length;
      i++){

    ctx.lineTo(
      points[i].x,
      points[i].y
    );
  }

  ctx.closePath();

  ctx.fill("evenodd");

  /* polygon */

  ctx.beginPath();

  ctx.moveTo(
    points[0].x,
    points[0].y
  );

  for(let i=1;
      i<points.length;
      i++){

    ctx.lineTo(
      points[i].x,
      points[i].y
    );
  }

  ctx.closePath();

  ctx.strokeStyle =
  "#FFD600";

  ctx.lineWidth = 6;

  ctx.stroke();

  /* corner dots */

  points.forEach(p=>{

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      10,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
    "#FFD600";

    ctx.fill();
  });
}

/* ====================================
CAPTURE IMAGE
==================================== */

function captureImage(){

  const canvas =
  document.createElement("canvas");

  canvas.width =
  video.videoWidth;

  canvas.height =
  video.videoHeight;

  const c =
  canvas.getContext("2d");

  c.drawImage(
    video,
    0,
    0
  );

  const img =
  canvas.toDataURL(
    "image/jpeg",
    0.95
  );

  const a =
  document.createElement("a");

  a.href = img;

  a.download =
  "scan-"+Date.now()+".jpg";

  a.click();
}

/* ====================================
TORCH
==================================== */

async function toggleTorch(){

  try{

    const track =
    stream.getVideoTracks()[0];

    const capabilities =
    track.getCapabilities();

    if(capabilities.torch){

      torch = !torch;

      await track.applyConstraints({
        advanced:[{
          torch:torch
        }]
      });
    }

  }catch(err){

    console.log(err);
  }
}

/* ====================================
CLOSE
==================================== */

function closeScanner(){

  scanning = false;

  if(stream){

    stream.getTracks()
    .forEach(track=>track.stop());
  }
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>V7.1 AI Document Scanner</title>

<!-- OpenCV -->
<script
src="https://docs.opencv.org/4.x/opencv.js">
</script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ====================================
APP
==================================== */

#app{
  position:fixed;
  inset:0;
  background:black;
}

video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* ====================================
TOPBAR
==================================== */

.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:50;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.85),
    transparent
  );
}

.icon-btn{
  width:50px;
  height:50px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  color:white;
  font-size:22px;
  backdrop-filter:blur(10px);
}

.title{
  color:white;
  font-size:18px;
  font-weight:bold;
}

/* ====================================
STATUS
==================================== */

.status{
  position:absolute;
  top:95px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 20px;
  border-radius:999px;

  background:rgba(0,0,0,.55);

  color:white;
  font-size:14px;

  z-index:50;

  backdrop-filter:blur(10px);
}

.ready-dot{
  position:absolute;
  top:105px;
  right:20px;

  width:16px;
  height:16px;
  border-radius:50%;

  background:#22c55e;

  box-shadow:0 0 20px #22c55e;

  z-index:50;
}

/* ====================================
BOTTOM
==================================== */

.bottom{
  position:absolute;
  bottom:40px;
  left:0;
  right:0;

  display:flex;
  justify-content:center;

  z-index:50;
}

.capture-btn{
  width:95px;
  height:95px;

  border-radius:50%;

  border:6px solid white;

  background:white;

  box-shadow:0 0 30px rgba(255,255,255,.6);
}

/* ====================================
LOADING
==================================== */

.loading{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:black;
  color:white;

  font-size:22px;

  z-index:999;
}

/* ====================================
HIDDEN CANVAS
==================================== */

#hiddenCanvas{
  display:none;
}

</style>
</head>
<body>

<div id="app">

  <div class="loading"
    id="loading">
    Loading OpenCV...
  </div>

  <!-- CAMERA -->
  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <!-- OVERLAY -->
  <canvas id="overlay"></canvas>

  <!-- PROCESSING -->
  <canvas id="hiddenCanvas"></canvas>

  <!-- TOPBAR -->
  <div class="topbar">

    <button class="icon-btn"
      onclick="closeScanner()">
      ✕
    </button>

    <div class="title">
      V7.1 AI Scanner
    </div>

    <button class="icon-btn"
      onclick="toggleTorch()">
      💡
    </button>

  </div>

  <!-- STATUS -->
  <div class="status"
    id="status">
    Mencari dokumen...
  </div>

  <div class="ready-dot"></div>

  <!-- BOTTOM -->
  <div class="bottom">

    <button class="capture-btn"
      onclick="captureImage()">
    </button>

  </div>

</div>

<script>

/* ====================================
GLOBAL
==================================== */

let stream = null;

let scanning = false;

let torch = false;

let cvReady = false;

let stablePoints = null;

/* ====================================
ELEMENTS
==================================== */

const video =
document.getElementById("video");

const overlay =
document.getElementById("overlay");

const hiddenCanvas =
document.getElementById("hiddenCanvas");

const statusText =
document.getElementById("status");

const ctx =
overlay.getContext("2d");

const hiddenCtx =
hiddenCanvas.getContext("2d");

/* ====================================
WAIT OPENCV
==================================== */

function waitForCV(){

  if(window.cv && cv.Mat){

    cvReady = true;

    document.getElementById(
      "loading"
    ).style.display = "none";

    startCamera();

  }else{

    setTimeout(waitForCV,300);
  }
}

waitForCV();

/* ====================================
START CAMERA
==================================== */

async function startCamera(){

  try{

    stream =
    await navigator.mediaDevices
    .getUserMedia({

      video:{
        facingMode:"environment",

        width:{ideal:1280},
        height:{ideal:720}
      },

      audio:false
    });

    video.srcObject = stream;

    video.onloadedmetadata = ()=>{

      overlay.width =
      video.videoWidth;

      overlay.height =
      video.videoHeight;

      /* lebih ringan */

      hiddenCanvas.width = 240;
      hiddenCanvas.height = 180;

      scanning = true;

      requestAnimationFrame(
        processFrame
      );
    };

  }catch(err){

    alert(
      "Tidak bisa mengakses kamera"
    );

    console.log(err);
  }
}

/* ====================================
MAIN LOOP
==================================== */

function processFrame(){

  if(!scanning) return;

  detectDocument();

  requestAnimationFrame(
    processFrame
  );
}

/* ====================================
DOCUMENT DETECTION
==================================== */

function detectDocument(){

  const w =
  hiddenCanvas.width;

  const h =
  hiddenCanvas.height;

  hiddenCtx.drawImage(
    video,
    0,
    0,
    w,
    h
  );

  let src =
  cv.imread(hiddenCanvas);

  let gray =
  new cv.Mat();

  let blur =
  new cv.Mat();

  let thresh =
  new cv.Mat();

  let edges =
  new cv.Mat();

  let contours =
  new cv.MatVector();

  let hierarchy =
  new cv.Mat();

  /* ============================
  GRAYSCALE
  ============================ */

  cv.cvtColor(
    src,
    gray,
    cv.COLOR_RGBA2GRAY
  );

  /* ============================
  BLUR
  ============================ */

  cv.GaussianBlur(
    gray,
    blur,
    new cv.Size(7,7),
    0
  );

  /* ============================
  ADAPTIVE THRESHOLD
  ============================ */

  cv.adaptiveThreshold(
    blur,
    thresh,
    255,

    cv.ADAPTIVE_THRESH_GAUSSIAN_C,

    cv.THRESH_BINARY,

    11,

    2
  );

  /* ============================
  CANNY
  ============================ */

  cv.Canny(
    thresh,
    edges,
    50,
    150
  );

  /* ============================
  MORPHOLOGY
  ============================ */

  let kernel =
  cv.Mat.ones(
    3,
    3,
    cv.CV_8U
  );

  cv.morphologyEx(
    edges,
    edges,
    cv.MORPH_CLOSE,
    kernel
  );

  /* ============================
  FIND CONTOUR
  ============================ */

  cv.findContours(
    edges,
    contours,
    hierarchy,

    cv.RETR_EXTERNAL,

    cv.CHAIN_APPROX_SIMPLE
  );

  let biggest = null;

  let maxArea = 0;

  for(let i=0;
      i<contours.size();
      i++){

    let cnt =
    contours.get(i);

    let peri =
    cv.arcLength(
      cnt,
      true
    );

    let approx =
    new cv.Mat();

    cv.approxPolyDP(
      cnt,
      approx,
      0.02 * peri,
      true
    );

    let area =
    cv.contourArea(cnt);

    if(
      approx.rows === 4 &&
      area > maxArea &&
      area > 3000
    ){

      biggest = approx;

      maxArea = area;
    }
  }

  ctx.clearRect(
    0,
    0,
    overlay.width,
    overlay.height
  );

  if(biggest){

    drawPolygon(biggest);

    statusText.innerHTML =
    "Dokumen terdeteksi";

  }else{

    statusText.innerHTML =
    "Mencari dokumen...";
  }

  /* cleanup */

  src.delete();
  gray.delete();
  blur.delete();
  thresh.delete();
  edges.delete();
  contours.delete();
  hierarchy.delete();
  kernel.delete();
}

/* ====================================
DRAW POLYGON
==================================== */

function drawPolygon(approx){

  const scaleX =
  overlay.width /
  hiddenCanvas.width;

  const scaleY =
  overlay.height /
  hiddenCanvas.height;

  let points = [];

  for(let i=0;
      i<4;
      i++){

    let x =
    approx.intPtr(i,0)[0];

    let y =
    approx.intPtr(i,0)[1];

    points.push({
      x:x * scaleX,
      y:y * scaleY
    });
  }

  /* ============================
  SMOOTHING
  ============================ */

  if(stablePoints){

    points = points.map((p,i)=>({

      x:
      stablePoints[i].x * 0.7 +
      p.x * 0.3,

      y:
      stablePoints[i].y * 0.7 +
      p.y * 0.3

    }));
  }

  stablePoints = points;

  /* ============================
  DARK OVERLAY
  ============================ */

  ctx.fillStyle =
  "rgba(0,0,0,.45)";

  ctx.beginPath();

  ctx.rect(
    0,
    0,
    overlay.width,
    overlay.height
  );

  ctx.moveTo(
    points[0].x,
    points[0].y
  );

  for(let i=1;
      i<points.length;
      i++){

    ctx.lineTo(
      points[i].x,
      points[i].y
    );
  }

  ctx.closePath();

  ctx.fill("evenodd");

  /* ============================
  POLYGON
  ============================ */

  ctx.beginPath();

  ctx.moveTo(
    points[0].x,
    points[0].y
  );

  for(let i=1;
      i<points.length;
      i++){

    ctx.lineTo(
      points[i].x,
      points[i].y
    );
  }

  ctx.closePath();

  ctx.strokeStyle =
  "#FFD600";

  ctx.lineWidth = 6;

  ctx.stroke();

  /* ============================
  CORNER POINT
  ============================ */

  points.forEach(p=>{

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      10,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
    "#FFD600";

    ctx.fill();
  });
}

/* ====================================
CAPTURE
==================================== */

function captureImage(){

  const canvas =
  document.createElement("canvas");

  canvas.width =
  video.videoWidth;

  canvas.height =
  video.videoHeight;

  const c =
  canvas.getContext("2d");

  c.drawImage(
    video,
    0,
    0
  );

  const img =
  canvas.toDataURL(
    "image/jpeg",
    0.95
  );

  const a =
  document.createElement("a");

  a.href = img;

  a.download =
  "scan-"+Date.now()+".jpg";

  a.click();
}

/* ====================================
TORCH
==================================== */

async function toggleTorch(){

  try{

    const track =
    stream.getVideoTracks()[0];

    const capabilities =
    track.getCapabilities();

    if(capabilities.torch){

      torch = !torch;

      await track.applyConstraints({
        advanced:[{
          torch:torch
        }]
      });
    }

  }catch(err){

    console.log(err);
  }
}

/* ====================================
CLOSE
==================================== */

function closeScanner(){

  scanning = false;

  if(stream){

    stream.getTracks()
    .forEach(track=>track.stop());
  }
}

</script>

</body>
</html>
